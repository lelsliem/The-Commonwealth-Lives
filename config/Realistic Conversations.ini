;=============================================================================//
;                                                                             //
;   Realistic Conversations — compatibility INI                                //
;                                                                             //
;   The 33 game-setting (GMST) overrides of the 2018 "Realistic               //
;   Conversations" ESP, re-delivered as a tuning file: the adapter reads      //
;   this file next to the DLL and applies each key to the game's own          //
;   GameSettingCollection at load — no xedit patch, no ESP, no load-order     //
;   slot. The NPC-to-NPC social system it drives is the game's *voiced*       //
;   ambient chatter (all NPCs everywhere); our sim's subtitle lines are a     //
;   separate, text-only channel that never touches these settings.            //
//                                                                             //
//   How to use: drop this file next to TheLivingCommonwealth.dll. Delete     //
//   it to disable — a missing file is the off switch.                         //
//                                                                             //
//=============================================================================//

; --- conversation chance & radius (the "NPCs talk to each other" heart) ------
fAISocialchanceForConversation       = 100
fAISocialchanceForConversationInterior = 100
fAISocialRadiusToTriggerConversation = 2000
fAISocialRadiusToTriggerConversationInterior = 1600
iAISocialDistanceToTriggerEvent      = 250
fAISocialTimerForConversationsMin    = 7
fAISocialTimerForConversationsMax    = 28

; --- greetings: closer, less robotic, less from a distance -------------------
fAIForceGreetingTimer                = 5
fAIExclusiveGreetingTimer            = 3.5
fAIGreetingTimer                     = 6
fAIMinGreetingDistance               = 85
fAIRandomChancePlayerInterrupt       = 66
fAIInDialogueModeWithPlayerDistance  = 450

; --- speech pacing & head tracking (alive faces, natural pauses) -------------
fDialogSpeechDelaySeconds            = 0.4
fGameplayVoiceFilePadding            = 0.2
fGameplaySpeakingEmotionMinChangeValue = 2.5
fAIHeadTrackDialoguePickNewOffsetTimer = 1
fAIHeadTrackDialogueStayInOffsetMax  = 3
fAIHeadTrackDialogueStayInOffsetMin  = 1.5
fAIHeadTrackStayInOffsetMax          = 3
fAIHeadTrackStayInOffsetMin          = 1.5
fAIHeadTrackDialogueResetPositionTimer = 2

; --- eating hours (lunch/dinner like people, not random) ---------------------
fSandboxDinnerMin                    = 16
fSandboxDinnerMax                    = 17
fSandboxMealDurationMax              = 0.4

; --- combat speak (taunts/status land with the hits, not constantly) ---------
fCombatSpeakAttackChance             = 0.65
fCombatSpeakHitChance                = 0.35
fCombatSpeakHitThreshold             = 0.1
fCombatSpeakPowerAttackChance        = 0.7
fCombatSpeakTauntChance              = 0.15
fCombatDialogueTauntMinElapsedTime   = 7.5

; --- misc social polish ------------------------------------------------------
fAICommentWaitingForPlayerInput      = 40
fCommentOnPlayerKnockingThings       = 150
