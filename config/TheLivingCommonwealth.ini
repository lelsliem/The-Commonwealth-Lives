; The Living Commonwealth tuning
;
; Place this file at Data\F4SE\Plugins\TheLivingCommonwealth.ini — next to
; the DLL. Unknown keys are ignored; missing, empty, or unparsable values
; keep the default. A broken line must never break the world.
;
; The values below are the living-Commonwealth tuning — the recommended
; starting point, not the code's own defaults. The code's built-in
; defaults are the fast demo (e.g. sim.hunger.decay 0.1/s — a meal
; every few seconds); the values here slow the world to "a few meals a
; day" and one file keeps both sides' keys (the core's and the
; adapter's). Where the file names a value it overrides the code
; default; missing, empty, or unparsable values keep the default.

; --- core keys (feed the Living Commonwealth Engine) ----------------------
sim.memory.fade = 0.2        ; memory fade rate
sim.jitter = 0.15            ; per-tick decay spread (0 = off)
sim.drift.rate = 0.0002      ; how fast feelings cool when nothing
                             ; refreshes them. Half-life ~1 hour real
                             ; time, so a shared meal keeps its glow and
                             ; repeated bench-meetings add up into bonds.
                             ; Lower = feelings last longer; higher =
                             ; closer to the old fast-demo feel.

; --- bonds (0.6.0) ----------------------------------------------------------
; The lines across disposition that name a relationship. When a pair's
; shared disposition (the minimum of the two directions — both must feel
; it) crosses a line, they bond: friend +0.3, sweetheart +0.6, spouse
; +0.8, rival -0.3, enemy -0.6. Formation is immediate; dissolution is
; sticky (a bond fades only when the disposition falls halfway back).
sim.bond.threshold.friend = 0.3
sim.bond.threshold.sweetheart = 0.6
sim.bond.threshold.spouse = 0.8
sim.bond.threshold.rival = -0.3
sim.bond.threshold.enemy = -0.6

; --- adapter keys (the seeded need rhythm) --------------------------------
; A need empties in ~1/rate seconds. 0.1/s is the fast demo default;
; "a few meals a day" is roughly 0.001–0.005/s.
sim.hunger.decay = 0.002
sim.fatigue.decay = 0.002
sim.safety.decay = 0.002
sim.social.decay = 0.002
sim.comfort.decay = 0.002

; --- sleep cycle (0.6.0) -----------------------------------------------------
; How fast a resting mind recovers the needs a nap fixes — Fatigue,
; Safety, and Comfort — per second. 0.2/s fills a drained need in ~5 s
; (a nap, a night). The need loop only decays; Rest is the recovery
; side, so a fed mind wakes and walks again — and a Safety-drained
; mind (which the engine would otherwise park) rests too.
sim.rest.recovery = 0.2

; --- walks (0.6.0) -----------------------------------------------------------
; How many settlers may walk at once. The command-mode travel flood
; guard; arrival frees a slot immediately, so 16 is generous. Big
; saves can raise it without a rebuild.
sim.walk.cap = 16

; --- economy ---------------------------------------------------------------
sim.sale.warmth = 0.1        ; how much a stall-keeper warms to a customer
sim.meal.price = 5           ; caps per meal (a broke buyer is still fed)

; --- market hours -----------------------------------------------------------
market.open.hour = 8         ; the market's hours — closed at night
market.close.hour = 20
