; --- dialogue pools (0.8.0, planned) ---------------------------------------------
; One-liners the sim says when minds meet — the same pattern as the
; dialogue pools: comma-separated, seeded picker per mind, missing or
; broken lists keep the built-in defaults. Curated from the game's own
; settler/guard-bank recordings (see Docs/Dialogue/LineCatalog.md).
; A line must never contain a comma — the list parser splits on commas,
; so mid-line pauses use an em-dash ("Hey — how's it going?"). Fight (2)
; and Feud (2) are thin by design: rare events whose real content (who,
; why) is memory-driven caption text, not voiced lines.
