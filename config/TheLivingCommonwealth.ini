; The Living Commonwealth tuning
;
; sim.diag.selfTest = 1 runs the load-order hello-world (0.8.x tooling):
; at plugin load, before the game world or any save, a short battery of
; pure checks (codec, seeded minds, names, bonds, the co-save round-trip)
; logs PASS/FAIL per check plus a summary. Turn it on for a test profile
; to prove the DLL is healthy in a heavy load order; keep it off (0) for
; normal play.
sim.diag.selfTest = 0
;
; Place this file at Data\F4SE\Plugins\TheLivingCommonwealth.ini — next to
; the DLL. Unknown keys are ignored; missing, empty, or unparsable values
; keep the default. A broken line must never break the world.
;
; The values below are the living-Commonwealth tuning — the recommended
; starting point, not the code's own defaults. The code's built-in
; defaults are the fast demo (e.g. sim.hunger.decay 0.1/s — a meal
; every few seconds); the values here slow the world to "a few meals a
; day" and one file keeps both sides' keys (the core's and the
; adapter's). Where the file names a value it overrides the code
; default; missing, empty, or unparsable values keep the default.

; --- core keys (feed the Living Commonwealth Engine) ----------------------
sim.memory.fade = 0.2        ; memory fade rate
sim.jitter = 0.15            ; per-tick decay spread (0 = off)
sim.hunger.desperate = 0.2   ; below ~20% hunger a mind ignores the closed
                             ; market sign and walks anyway — the refusal
                             ; that starts a feud (0.7.0 engine 509a54d).
                             ; 0 = never desperate (stock behavior).
sim.drift.rate = 0.0002      ; how fast feelings cool when nothing
                             ; refreshes them. Half-life ~1 hour real
                             ; time, so a shared meal keeps its glow and
                             ; repeated bench-meetings add up into bonds.
                             ; Lower = feelings last longer; higher =
                             ; closer to the old fast-demo feel.

; --- bonds (0.6.0) ----------------------------------------------------------
; The lines across disposition that name a relationship. When a pair's
; shared disposition (the minimum of the two directions — both must feel
; it) crosses a line, they bond: friend +0.3, sweetheart +0.6, spouse
; +0.8, rival -0.3, enemy -0.6. Formation is immediate; dissolution is
; sticky (a bond fades only when the disposition falls halfway back).
sim.bond.threshold.friend = 0.3
sim.bond.threshold.sweetheart = 0.6
sim.bond.threshold.spouse = 0.8
sim.bond.threshold.rival = -0.3
sim.bond.threshold.enemy = -0.6

; --- adapter keys (the seeded need rhythm) --------------------------------
; A need empties in ~1/rate seconds. 0.1/s is the fast demo default;
; "a few meals a day" is roughly 0.001–0.005/s.
sim.hunger.decay = 0.002
sim.fatigue.decay = 0.002
sim.safety.decay = 0.002
sim.social.decay = 0.002
sim.comfort.decay = 0.002

; --- sleep cycle (0.6.0) -----------------------------------------------------
; How fast a resting mind recovers the needs a nap fixes — Fatigue,
; Safety, and Comfort — per second. 0.2/s fills a drained need in ~5 s
; (a nap, a night). The need loop only decays; Rest is the recovery
; side, so a fed mind wakes and walks again — and a Safety-drained
; mind (which the engine would otherwise park) rests too.
sim.rest.recovery = 0.2

; --- walks (0.6.0) -----------------------------------------------------------
; How many settlers may walk at once. The command-mode travel flood
; guard; arrival frees a slot immediately, so 16 is generous. Big
; saves can raise it without a rebuild.
sim.walk.cap = 16

; How long a mind whose walk was refused (no actor or no AI process —
; an actor in a streamed-out cell, or the game's AI not yet started)
; stays parked before trying again, in seconds. Without it a few such
; minds retry every frame and the refusal line floods the log.
sim.walk.refusalCooldown = 30

; --- the meal-cadence wander (0.6.0) ------------------------------------------
; How a resting or exploring settler spends its time: commanded to a
; real nearby reference (furniture preferred), then the sandbox plays
; until the next command. Cooldown is seconds between commands (must
; exceed a short walk — re-issuing mid-walk yanks the actor); radius is
; game units (~1.4 cm each — 4000 is a settlement-sized circle).
sim.wander.cooldown = 30
sim.wander.radius = 4000

; --- economy ---------------------------------------------------------------
sim.sale.warmth = 0.1        ; how much a stall-keeper warms to a customer
sim.meal.price = 5           ; caps per meal (a broke buyer is still fed)

; --- arcs (0.6.0) -------------------------------------------------------------
; The stories that happen because life happens. Grief: a mind that
; loved the dead drains Social faster — they seek company. Mediation:
; once per day, a settlement that has heard of a feud tries to cool it.
sim.arc.grief.decay = 0.01   ; extra Social drain per second while grieving
sim.arc.mediation = 1        ; 0 = the settlement never steps in

; --- burial (0.8.2) -----------------------------------------------------------
; How many world days a settlement leaves a body before laying it to
; rest. The game corpse otherwise stays in the settlement cell forever
; (no cell reset there). Measured in whole world days; the sweep runs
; once per second, so a body is buried within a second of the window
; expiring — even one whose death predates this session.
sim.death.burialDays = 3

; --- birth (0.6.0, experimental) ----------------------------------------------
; A spouse household may have a child — a sim-only mind (no game
; actor), fed by the household, bonded to both parents, living in the
; co-save. Off by default; flip to 1 when you want generations.
sim.birth.enabled = 0

; The conception chance (0.7.7): each eligible spouse pair rolls
; once per sim day; this is the probability [0,1]. 0.05 means ~1
; birth per 20 couple-days. Higher values flood settlements quickly.
sim.birth.chance = 0.05

; The gestation window (0.7.7): sim-days between conception and
; birth. 3 = ~3 in-game days. Set to 1 for instant test births.
sim.birth.gestation = 3

; The childhood duration (0.7.7): sim-days a child stays a child
; before growing into a walking adult mind. Longer than gestation.
sim.birth.childhood = 10

; The visible-children flag (0.7.8): when on and the external
; baby mod ("Baby Sim - Babies That Grow Up") is loaded, a grown
; child pairs with a real game actor — it walks, trades, bonds.
; When off (default) or the mod absent, children stay sim-only.
sim.birth.visible = 0

; --- illness (0.8.0) ----------------------------------------------------------
; The price of being in the wastes. Every mind carries a Health
; component (1.0 healthy, 0.0 dead); the illness curve is
; hold-then-recover — on contraction health drops to the hold level
; and stays while the sickness runs, then climbs back at the recovery
; rate. Untreated severity at the top can drain toward death — the
; rescue window — but a dose of medicine (or a mild enough case)
; turns it around. Death is rare and earned.
sim.illness.enabled = 1

; The hold level on contraction: health drops here and holds while
; the illness runs. 0.4 = visibly sick, not dead.
sim.illness.hold = 0.4

; How much faster the sick tire: Fatigue decay × this while ill.
; 2.0 = twice as fast — the visible cost is rest, not a stat.
sim.illness.fatigueMult = 2.0

; How much faster the sick get hungry: Hunger decay × this while
; ill. The counter to the fatigue coma: a sick mind tires faster
; *and* empties its belly faster, so within the hold it gets
; hungry enough to walk to the market — where the medicine lives.
sim.illness.hungerMult = 2.0

; Health per second once the hold ends (recovery starts).
sim.illness.recovery = 0.05

; The hold window, sim seconds. Long enough to feel like an
; illness and to span a meal cycle (so the sick get hungry
; mid-hold and can seek the market); short enough to watch a full
; cycle in a session. 300 = the tuned length: at the default
; 0.002/s hunger decay × the 2× toll, hunger empties at 250 s,
; mid-hold.
sim.illness.duration = 300

; Contraction chances, per vector. Radstorms expose per radstorm
; day; food and wounds roll at the event; contagion spreads from
; the sick to their settlement at this rate per second.
sim.illness.radstormChance = 0.3
sim.illness.foodChance = 0.1
sim.illness.woundChance = 0.15
sim.illness.contagionChance = 0.03

; Caps for a dose of medicine at the stall. 0 = no medicine
; anywhere — a sick settlement suffers honestly.
sim.illness.medicinePrice = 25

; Doses a stall stocks per market day (0.8.3). Medicine is not an
; endless shelf: an outbreak can outrun the market, and a stall
; that sells out is empty until the next market day refills it.
; 0 = no stall ever carries medicine.
sim.illness.stock = 10

; Severity growth per second while untreated. Severity drives the
; fatigue toll's ease-off and, at the top, death. 0.002 is the
; tuned rate: over the 300 s hold it grows 0.6, so the mild
; vectors (radstorm 0.3, contagion 0.25, food 0.2) stay under the
; death line and recover, while a wound (0.5) crosses it late —
; the death that must be earned. The old 0.01/s killed everyone
; (1.2 growth > any seed ≥ −0.2): the day-11 outbreak took 108.
sim.illness.severityRate = 0.002

; Children are more fragile: their severity grows this many times
; faster. 1.1 (0.8.1) is tuned so rest cures a child's common
; vectors (radstorm/contagion/food all stay under the death line) —
; at 2.0 every untreated childhood illness was fatal, and children
; can't reach the market's medicine (no pouch, no walk). Only a
; wound crosses the line, and a child can't earn one in a brawl.
sim.illness.childMult = 1.1

; Severity at or above this while untreated can end a mind.
sim.illness.deathSeverity = 1.0

; Health per second a severity-capped illness drains toward death.
; The window between the cap and the end is the rescue window —
; medicine or rest can still turn it around.
sim.illness.deathDrain = 0.01

; The cough tell (0.8.0 polish): how often a sick mind plays the
; game's own coughing idle (sim seconds). 0 = no cough, the illness
; lives in the log and the fatigue toll only.
sim.illness.coughInterval = 12

; The global cough gate (0.8.1 field pass): one cough anywhere per
; this many seconds, on top of the per-mind interval. A
; settlement-wide outbreak would otherwise be a wall of sound — 50
; sick minds is ~4 coughs a second. 0 = no global gate.
sim.illness.coughGlobal = 4

; The illness radio (0.8.1 field pass): an outbreak is one story,
; not fifty lines. At most this many "X is ill" names enter the
; news per window, then wait for the next one; each mind still
; announces exactly once. 0 = no illness news at all.
sim.illness.newsMax = 4
sim.illness.newsInterval = 10

; --- market hours -----------------------------------------------------------
market.open.hour = 8         ; the market's hours — closed at night
market.close.hour = 20

; --- names (0.7.0) -------------------------------------------------------------
