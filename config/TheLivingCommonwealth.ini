; --- the conflict source (0.7.0) ------------------------------------------------
; The temperament line. A mind whose temper is at or above this blames
; the stall-keeper when a hungry arrival finds the market shut — the
; slight that can cross the rival and enemy lines and begin a feud. A
; warmer mind forgives (the stall was just shut — no one to blame).
; 1.0 is even-tempered; tempers vary per mind roughly 0.8–1.2.
sim.slight.temper = 1.0

; --- fights (0.7.5) --------------------------------------------------------------
; The physical escalation: when an enemy pair rows at the bench (or a
; slighted mind faces an enemy keeper), the temper and chance decide
; whether blows land. Chance is the coin — 0.1 keeps fights rare
; (verbal-first is the rule: rivals stay words); 1.0 forces every
; eligible escalation (the test knob). Temper is the aggressor's line,
; the same shape as sim.slight.temper — at or above it, the churlish
; throw the punch; below it, they swallow the insult.
sim.fight.chance = 0.1
sim.fight.temper = 1.0      ; the same line governs the retaliation: a
                            ; victim whose temper is at or above it
                            ; shoves back — one exchange, never a loop
sim.fight.push = 3          ; the FALL's force (0.7.6): the paired
                            ; push IS the shove — the victim is carried
                            ; by the animation, so this force only puts
                            ; them DOWN. 3 is the tip-over zone: the
                            ; victim falls in place, no ground-slide
                            ; (force 6-9 was the "ghost push" that
                            ; dragged the victim after the kick). Game
                            ; units; above 10 is the ragdoll launch
                            ; zone. 0 = no fall, the fight books
                            ; without the physics. The force jitters
                            ; per victim (deterministic, capped at
                            ; 1.15x), so no two falls land exactly
                            ; alike. If you have an old sim.fight.push
                            ; = 8 line in your INI, delete it to
                            ; inherit this default (8 was the
                            ; ground-slide). Presets: leave
                            ; sim.fight.chance at 0.1
                            ; for the rare-and-earned drama; 0.25 for
                            ; a lively settlement; 1.0 is the test knob
                            ; (every eligible row turns to blows)

sim.fight.stagger = 2        ; the standing shove's flinch: the game's
                            ; melee hit-reaction (the stagger that plays
                            ; when a punch lands) fires BEFORE the fall,
                            ; so the punch reads as a shove instead of a
                            ; silent collapse. Magnitude: 1 small, 2
                            ; medium, 3 large, 4 extra-large. 0 = no
                            ; flinch, the fall still lands.

sim.fight.pushback = 25     ; the flinch's push-back: how far the
                            ; victim stumbles backward before the fall,
                            ; in the game's units. 0 = flinch in place.

sim.fight.fall.delay = 0.9  ; seconds between the flinch and the
                            ; knock-down. They MUST NOT land in the
                            ; same frame — the knock overrides the
                            ; stagger before it is visible, and the
                            ; punch reads as a silent collapse. 0.9s
                            ; lets the stagger play, then the fall.
sim.fight.retaliation.delay = 7 ; the scuffle's beat: a hot-headed
                            ; victim answers the punch this many seconds
                            ; later — push, fall, get up, push back — so
                            ; the exchange reads as a sequence, not both
                            ; falling at once. 7s so the get-up animation
                            ; finishes before the answer lands.

sim.fight.part.delay = 3   ; the parting beat: seconds between the
                            ; counter-fall and the loser walking off.
                            ; The loser must GET UP before fleeing — a
                            ; same-instant walk-off was a ghost sprint
                            ; from the ground.

; --- the test hook (0.7.5) --------------------------------------------------------
; Force a specific pair to brawl on a loop for spectating and testing:
; the full fight machinery (shove, retaliation, news, gossip) fires every
; interval seconds, the pair pinned to an enemy feud and the once-per-day
; gate bypassed — a test brawl, not the sim. Both form ids 0 = off.
; Form ids are the low 24 bits of the actor refs, in DECIMAL (the INI
; reader is std::stof — no hex). The ready-made test pair: Sturges
; (0001A4D8 = 107736) and Jun Long (0001A4DB = 107739).
sim.test.forceFight.a = 0     ; e.g. 107736 for Sturges
sim.test.forceFight.b = 0     ; e.g. 107739 for Jun Long
sim.test.forceFight.interval = 15 ; seconds between blows

; The audio trigger probe (0.8.7a): sim.diag.audioProbe = 1 makes the
; probe pick a nearby pair and force the game's own greeting dialogue
; (AIProcess::ProcessGreet with the other NPC as target — the same
; family as the kick's PlayIdle seam) so A voices a hello at B and B
; answers, every sim.diag.audioProbe.every seconds. Stand near a
; settlement and listen; the log tags each side of the exchange. This
; was the experiment that proved the in-world seam — the production
; crossings (sim.interact.voice) now do the same thing, so the probe
; is diagnostic-only and off by default.
; The Say-via-VM route is REMOVED (2026-08-15) — it was the 0.8.7
; crasher: every CTD's minidump stack read AudioProbeLoop ->
; PackVariables<TESTopic, Actor, bool, TESObjectREFR> ->
; BSScript::Variable::reset -> Fallout4.exe+0x21173A0 (null deref),
; firing exactly when a settler was within sim.subtitle.radius of the
; player — "crash whenever I go near an NPC". The VM's object-dispatch
; is broken in this build (static Math.Sqrt dispatched; every handle /
; self-object call FAILED at the boundary), so ProcessGreet — which
; was gated OFF in every crashing session and is untested — is tried
; alone here. It plays the game's own greeting for the actor's voice,
; not our curated line (that needs the dead Say route). Normal play
; stays caption-only: this is a test switch, off by default, and
; never ships in a release INI.
sim.diag.audioProbe = 0
sim.diag.audioProbe.every = 20 ; seconds between probe attempts

; The crash-hunt bisect gate (0.8.7): sim.diag.noWalks = 1 makes every
; Movement command (WalkTo / WanderNear / HoldPlace / WalkAwayFrom)
; refuse without touching the game — the sim never issues a
; command-mode travel package. The pinned InitiateCommandModeTravelPackage
; is the documented-risk game call (a past heap-corruption suspect whose
; earlier exoneration was a corrupt save — clean saves crash now, so the
; suspicion is reopened). Test: stable with this ON = the walk is the
; crasher; still crashing = the next system gets gated. Off by default —
; never ships in a release INI.
sim.diag.noWalks = 0

; The crash-hunt bisect gate #2 (0.8.7): sim.diag.noInteract = 1 skips
; the random-interaction pass entirely — no proximity-triggered
; voice/subtitle lines (GetFormByID / GetNPC / voiceType reads). The
; 17:14 session gated every walk AND the audio probe AND subtitles and
; still crashed 1s after the [voice]: lines fired, so the interact path
; is the next suspect after the walk was cleared. Test: stable with
; this ON = the interact path is the crasher; still crashing = the
; census gets gated next. Off by default — never ships in a release INI.
sim.diag.noInteract = 0

; --- the player window (0.7.0) --------------------------------------------------
; The news feed: world events as on-screen notifications, throttled so
; a flood of lines is not a flood of windows. The settlement radio
; reads the same feed as captions while one is near the player —
; radio.base.formid is the workshop "Radio" (flagged: verify in xEdit
; before trusting it; the key exists so a wrong pin is a config line,
; never a rebuild).
sim.news.enabled = 1
sim.news.cooldown = 5        ; seconds between on-screen news
sim.radio.caption.every = 45 ; seconds between radio captions
sim.radio.radius = 3000      ; game units — how near the radio must be
radio.base.formid = 0x1A17D

; --- the loud line's hearing range (0.7.5) -----------------------------------
; A spoken line pops as a top-left HUD notification (the same native
; feed quest updates and the radio captions use) only when the player
; is close enough to hear it. Game units: 500 is a market square's
; worth of hearing; 0 disables the chatter feed entirely. (The first
; presentation rode the game's dialogue-subtitle box; it read as fake
; in-conversation dialogue with no audio — 0.8.7 — so the proximity
; lines moved to the native notification feed.)
sim.subtitle.radius = 500

; --- the chatter feed's cadence (0.8.7) ---------------------------------------
; Proximity lines throttle to one on-screen notification every this
; many seconds — a settlement's small talk reads as a slow native
; ticker, not a subtitle flood. The log always keeps the full record.
sim.chatter.cooldown = 5

; --- the announcement categories (0.8.7) --------------------------------------
; The world's bulletin board — birth, death, illness, the bonds
; (friends, rivals, sweethearts, married, feuds, peace), fights, and
; the market — with per-category toggles:
;   enabled — the event enters the feed at all (and can reach the
;             settlement radio); 0 = the world stays silent about it
;   subs    — the event also pops on-screen as a top-left notification
;   audio   — that pop plays a chime
sim.news.death.enabled = 1
sim.news.death.subs = 1
sim.news.death.audio = 0
sim.news.illness.enabled = 1
sim.news.illness.subs = 1
sim.news.illness.audio = 0
sim.news.birth.enabled = 1
sim.news.birth.subs = 1
sim.news.birth.audio = 0
sim.news.bonds.enabled = 1
sim.news.bonds.subs = 1
sim.news.bonds.audio = 0
sim.news.fight.enabled = 1
sim.news.fight.subs = 1
sim.news.fight.audio = 0
sim.news.market.enabled = 1
sim.news.market.subs = 1
sim.news.market.audio = 0

; --- the verify channel (0.7.4) ------------------------------------------------
; How often a mind's "decides X" line may print while its intent
; flip-flops between near-tied options (Rest/Explore re-roll every
; frame). Real intent changes still print instantly. 5.0 keeps a full
; world's log readable (~7 lines/second at 191 minds instead of ~36);
; raise it to silence the channel entirely.
sim.log.decisions.every = 5.0

; The walk probe gate (0.8.0 polish, off by default since 0.8.11):
; the per-walker "d = ..." progress heartbeats are the log's biggest
; single contributor. 1 = on (development — the probe is the
; verification eyes), 0 = off (the arrival and session-end lines
; stay; only the progress heartbeats go).
sim.log.probes = 0

; --- legacy (0.7.0, engine side) -----------------------------------------------
; What survives the entity: a death bequeaths the dead's memories to
; the household's heir (facts at or above the floor, scaled), and the
; dead's name becomes a registry-level legacy — permanent until the
; world forgets it. A birth inherits the parents' memories of the
; people, aged no further than the max age (0 = any age).
sim.legacy.bequestFloor = 0.5
sim.legacy.inheritanceScale = 0.5
sim.legacy.maxAgeDays = 0

; --- society echo (0.6.0 stone 09, engine side) -------------------------------
; How strongly a feeling reaches the rest of a settlement: a sale's
; warmth and a slight's chill both echo to group-mates at this
; fraction. 0.5 = half as strong as the direct feeling; 0 = private.
sim.group.inheritance = 0.5
