; it (Sturges stays Sturges); a generic "Settler" draws first name from
; the male or female list (the actor's sex), a family name from the
; shared lasts, deduped against the world's live names. Animals draw
; from their own pool — a dog is "Rex", not "Rex Hart". Each list is
