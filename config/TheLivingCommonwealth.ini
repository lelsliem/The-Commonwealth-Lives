; --- dialogue pools (0.8.0, planned) ---------------------------------------------
; One-liners the sim says when minds meet — the same pattern as the
; name pools: comma-separated, seeded picker per mind, missing or
; broken lists keep the built-in defaults. The row pool is the
; author's verbal→physical ramp: the complaint, the dare, the taunt,
; the break point, and the escalation. Keep lines short — if it takes
; more than ten words, cut it.
dialogue.greet = Mornin', You're up early, Settler, Peaceful day, Still breathing — good, Good to see you, Quiet today, Coffee's cold — company's warm, Heard you was coming
dialogue.gossip = Heard about the market?, There's trouble brewing, Keep it between us, They're at it again, Storm's on the way, Caps are tight this week, Saw a trader on the road, The kids are driving me mad, Another settlement's gone quiet, Don't trust the weather
